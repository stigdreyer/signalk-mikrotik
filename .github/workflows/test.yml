name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Like the Signal K plugin registry: no install scripts.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate --omit=dev
      - name: The package contains what the Appstore needs
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = new Set(require("./pack.json")[0].files.map((f) => f.path));
            const pkg = require("./package.json");
            const need = ["CHANGELOG.md", "README.md", "LICENSE", pkg.main, ...pkg.signalk.screenshots.map((s) => s.replace("./", ""))];
            const missing = need.filter((f) => !files.has(f));
            if (missing.length) { console.error("missing from the package:", missing); process.exit(1); }'
