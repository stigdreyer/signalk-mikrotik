<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allowlist · MikroTik Data Meter</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F2EF">
<link rel="stylesheet" href="style.css">
<script src="mode.js"></script>
<style>
  html { scroll-padding-bottom: 160px; } /* rows scrolled into view clear the sticky save bar */

  /* The data share: one bar of the period's data, a segment per service. Solid gets through while metered,
     hatched is blocked, so the difference survives night mode's single red. */
  .share-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; margin-bottom: 8px; }
  .share-head h2 { margin: 0; font-size: 0.9375rem; }
  .share-head h2 span { font-weight: 400; color: var(--text-2); }
  .share-tools { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; font-size: 0.8125rem; }
  .sharebar { display: flex; gap: 2px; height: 40px; border-radius: 6px; overflow: hidden; }
  .seg-share { border: none; padding: 0; min-width: 3px; cursor: pointer; background: var(--normal); }
  .seg-share.blocked { background: repeating-linear-gradient(135deg, var(--line) 0 3px, var(--panel) 3px 7px); }
  .seg-share:focus-visible { outline-offset: -2px; }
  .sharewrap { position: relative; }
  .seg-share.on { box-shadow: inset 0 0 0 2px var(--text); } /* the segment the label is about */
  .keys { display: grid; gap: 4px; font-size: 0.8125rem; color: var(--text-2); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .key b { color: var(--text); font-weight: 600; }
  .key::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--normal); }
  .key.blocked::before { background: repeating-linear-gradient(135deg, var(--line) 0 2px, var(--panel) 2px 4px); outline: 1px solid var(--line); outline-offset: -1px; }
  .share .note { font-size: 0.8125rem; margin: 6px 0 0; }

  /* Browse: a filter and sort column beside the list (desktop); one "Filter & sort" section above it on phones. */
  .browse { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; margin-top: 16px; }
  /* One scroll for the whole page. The column sticks beside the list when it fits the window; when it is taller
     (Show all), it scrolls with the page until its end is in view above the save bar, then sticks there. */
  .side { position: sticky; top: var(--side-top, 0px); padding: 12px 0 16px; }
  .side > details > summary { display: none; }
  .group + .group { margin-top: 20px; }
  .side h2 { font-size: 0.8125rem; font-weight: 600; color: var(--text-2); margin: 0 0 4px; }
  .opt { display: flex; align-items: center; gap: 10px; min-height: 32px; cursor: pointer; }
  .opt .n { margin-left: auto; font-size: 0.8125rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .toolbar { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 12px 0 8px; border-bottom: 1px solid var(--grid); }
  input[type="search"] { font: inherit; width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); }
  .linkbtn { font-size: 0.8125rem; background: none; border: none; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 2px; min-height: 44px; }

  .item { border-bottom: 1px solid var(--grid); transition: background 1.2s ease-out; }
  .item.flash { background: var(--panel); transition: none; }
  .line { display: flex; align-items: center; gap: 12px; min-height: 56px; }
  .name { flex: 1; min-width: 0; padding: 8px 0; background: none; border: none; text-align: left; cursor: pointer; }
  .name .title { font-weight: 500; }
  .name small { display: block; font-size: 0.8125rem; color: var(--text-2); margin-top: 1px; }
  .name small .blocked { color: var(--warn); font-weight: 600; }
  .tag { display: inline-block; font-size: 0.6875rem; padding: 0 6px; margin-left: 6px; border-radius: 4px; border: 1px solid currentColor; color: var(--text); font-weight: 600; vertical-align: 1px; }
  .tag.closing { border-style: dashed; }
  .gb { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 64px; }
  .gb small { display: block; font-size: 0.75rem; color: var(--text-2); }
  /* A standard switch: on = gets through while metered. */
  .switch { flex: none; position: relative; width: 48px; height: 28px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--text-2); transition: left 0.15s ease-out; }
  .switch[aria-checked="true"] { background: var(--fill); border-color: var(--text); }
  .switch[aria-checked="true"]::after { left: 23px; background: var(--on-fill); }
  :root[data-mode="night"] .switch[aria-checked="true"]::after { background: var(--text); }
  .switch:disabled { opacity: 0.55; cursor: default; }
  .switch::before { content: ""; position: absolute; inset: -9px -2px; } /* 44px tall tap area */
  .details { font-size: 0.8125rem; color: var(--text-2); margin: 0 0 12px; overflow-wrap: anywhere; }
  .details div { margin-top: 2px; }
  .listnote { font-size: 0.8125rem; }
  .empty, .add { margin: 12px 0; }
  .fixed .title { padding-top: 8px; font-weight: 500; }

  .savebar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--grid); padding: 10px 0 12px; margin-top: 16px; }
  .savebar .pending { font-size: 0.8125rem; margin-bottom: 8px; }
  .savebar .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #status.confirm { color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  #status.error { border: 1px solid currentColor; border-radius: 6px; padding: 4px 8px; }
  #lists[aria-busy="true"], #share[aria-busy="true"] { opacity: 0.45; }

  @media (max-width: 760px) {
    .browse { grid-template-columns: 1fr; gap: 0; }
    .side { position: static; padding: 0; border-bottom: 1px solid var(--grid); }
    .side > details > summary { display: list-item; min-height: 44px; padding: 12px 0; font-size: 0.875rem; color: var(--text-2); }
    .side > details[open] { padding-bottom: 12px; }
    .toolbar { position: static; }
  }
  @media (pointer: coarse) { .opt { min-height: 44px; } }
  @media (prefers-reduced-motion: reduce) { .item, .switch::after { transition: none; } }
</style>
</head>
<body>
<header class="appbar"></header>
<main>
  <h1 class="sr-only">Allowlist</h1>
  <div id="message" class="error" role="alert"></div>

  <section class="share" id="share" aria-labelledby="sharetitle">
    <div class="share-head">
      <h2 id="sharetitle">…</h2>
      <div class="share-tools"><span class="seg" id="period" role="group" aria-label="Data shown" hidden></span><button id="reset" class="linkbtn">Start counting from now</button><span id="resetnote" role="status"></span></div>
    </div>
    <div class="sharewrap">
      <div class="sharebar" id="sharebar" role="group" aria-label="Data per service; arrow keys move between services"></div>
      <div class="tip" id="sharetip" hidden></div>
    </div>
    <div class="keys" id="keys"></div>
    <p class="note muted" id="sharenote" hidden></p>
  </section>

  <div class="browse">
    <aside class="side" aria-label="Filter and sort">
      <details id="sidebox">
        <summary id="sidesum">Filter &amp; sort</summary>
        <div class="group"><h2 id="sorttitle">Sort by</h2><div id="sort" role="radiogroup" aria-labelledby="sorttitle"></div></div>
        <div class="group"><h2>Show</h2><div id="filters"></div><button id="clearfilters" class="linkbtn" hidden>Clear filters</button></div>
      </details>
    </aside>
    <div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search services or domains" aria-label="Search seen services and the v2fly catalog" autocomplete="off">
      </div>
      <div id="lists"></div>
    </div>
  </div>

  <section>
    <details id="fixedbox">
      <summary class="muted">Always allowed</summary>
      <div id="fixed" class="fixed"></div>
    </details>
  </section>
  <p class="muted" id="credit"></p>

  <div class="savebar">
    <div class="pending" id="pending" hidden></div>
    <div class="actions">
      <button id="save" class="primary" disabled>Save</button>
      <button id="discard" class="linkbtn" hidden>Discard changes</button>
      <span id="status" class="muted" role="status"></span>
      <span id="savedat" class="muted"></span>
    </div>
  </div>
</main>
<script>
const API = "/plugins/signalk-mikrotik";
const $ = (id) => document.getElementById(id);
const SECONDS_PER_ENTRY = 0.03; // measured on a hAP: about 29 ms per DNS entry the router adds
const SHARE_MIN = 0.03;          // services below 3% of the period's data join "others" in the bar
let view;              // last GET /allowlist
let picked;            // { services: Set, domains: Set } as edited
let catalogHits = [];  // GET /catalog results for the current search
const filter = { categories: new Set(), ads: false, blocked: false, q: "", period: null, sort: "data" }; // period: "days" or "since" the reset; categories by label
const SORTS = [["data", "Most data"], ["name", "Name, A–Z"], ["recent", "Recently seen"], ["days", "Most days seen"]];
const CATEGORIES_SHOWN = 10; // the long tail folds behind "Show all", so the column usually fits the window
let allCategories = false;
const open = new Set(); // rows with their details open
let flashed = new Set(); // rows just saved, marked for a moment
let catalogFailed = false;
let searching = false;  // a catalog search is on its way

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    credentials: "same-origin",
    ...opts,
    headers: opts.body ? { "content-type": "application/json" } : {},
  });
  if (res.status === 401 || res.status === 403) throw new Error("Log in to the Signal K admin UI to see this page.");
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
  return res.json();
}

// v2fly ids and categories read like "apple-update" and "category-ai-chat-!cn".
const ACRONYMS = { ai: "AI", cdn: "CDN", doh: "DoH", ntp: "NTP", vpn: "VPN", tv: "TV", ddns: "DDNS", ip: "IP", stun: "STUN", ipfs: "IPFS", ios: "iOS", aws: "AWS", bbc: "BBC", cnn: "CNN", hbo: "HBO" };
const BRANDS = {
  whatsapp: "WhatsApp", youtube: "YouTube", icloud: "iCloud", itunes: "iTunes", openai: "OpenAI", github: "GitHub", gitlab: "GitLab",
  tiktok: "TikTok", linkedin: "LinkedIn", paypal: "PayPal", playstation: "PlayStation", onedrive: "OneDrive", wechat: "WeChat",
  soundcloud: "SoundCloud", bytedance: "ByteDance", macos: "macOS", deepl: "DeepL", duckduckgo: "DuckDuckGo", wetransfer: "WeTransfer",
  dazn: "DAZN", nordvpn: "NordVPN", expressvpn: "ExpressVPN", protonmail: "ProtonMail", xbox: "Xbox", primevideo: "Prime Video",
};
const words = (s) => s.split("-").map((w, i) => BRANDS[w] ?? ACRONYMS[w] ?? (i ? w : w[0].toUpperCase() + w.slice(1))).join(" ");
const prettyId = (id) => words(id);
// v2fly's short category ids, in words a crew would use.
const CATEGORY_NAMES = { cas: "Certificate authorities", orgs: "Organisations", netdisk: "Cloud storage", voip: "VoIP",
  "ip-geo-detect": "IP geolocation", dev: "Developer tools", "password-management": "Password managers", "web-archive": "Web archives",
  "consent-management": "Cookie consent", "social-media": "Social media", "ai-chat": "AI chat", cdn: "CDN" };
const prettyCategory = (c) => { const id = c.replace(/^category-/, "").replace(/-!cn$/, ""); return CATEGORY_NAMES[id] ?? words(id); };

function ago(ms) {
  const min = Math.round((Date.now() - ms) / 60_000);
  if (min < 2) return "just now";
  if (min < 90) return `${min} min ago`;
  const h = Math.round(min / 60);
  return h < 36 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}
function bytes(n) {
  if (n < 1e6) return `${Math.round(n / 1e3)} KB`;
  if (n < 1e9) return `${Math.round(n / 1e6)} MB`;
  return `${(n / 1e9).toFixed(n < 1e10 ? 2 : 1)} GB`;
}
const plural = (n, one, many = `${one}s`) => `${n.toLocaleString()} ${n === 1 ? one : many}`;
const list = (names) => (names.length <= 2 ? names.join(" and ") : `${names.slice(0, -1).join(", ")} and ${names.at(-1)}`);
const since = () => filter.period === "since";
const vols = (it) => (since() ? it.seen?.since : it.seen?.bytes) ?? [0, 0]; // [normal, metered]
const total = (it) => vols(it)[0] + vols(it)[1];
const at = (ms) => new Date(ms).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
const dated = (ms) => new Date(ms).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const FQDN = /^(?=.{1,253}$)([a-z0-9-]{1,63}\.)+[a-z]{2,63}$/;
const periodText = () => (since() ? `since ${at(view.reset.at)}` : `in the last ${view.keepDays} days`);

function el(tag, props = {}, ...children) {
  const e = Object.assign(document.createElement(tag), props);
  // Children may be conditional (`cond && el(...)`): keep only text and nodes, so 0/false/null vanish.
  e.append(...children.flat().filter((c) => typeof c === "string" || c instanceof Node));
  return e;
}

/** Services and domains as one kind of row. */
function items() {
  const services = view.services.map((s) => ({ kind: "services", key: s.id, title: prettyId(s.id), categories: s.categories, ...s }));
  const domains = view.domains.map((d) => ({ kind: "domains", key: d.domain, title: d.domain, categories: d.category ? [d.category] : [], ...d }));
  // Domains typed in and switched on, not looked up on board yet.
  const typed = [...(picked?.domains ?? [])].filter((d) => !view.domains.some((x) => x.domain === d))
    .map((d) => ({ kind: "domains", key: d, title: d, domain: d, categories: [], allowed: false, ads: false, seen: null, names: [] }));
  return [...services, ...domains, ...typed];
}

// "companies" says nothing, and v2fly's regional lists (-cn, -ir, -ru, …) are about other countries' routing.
const useful = (c) => c !== "category-companies" && !/-(cn|ir|ru|jp|hk|uk|mm)$/.test(c);
const isAds = (it) => it.ads || it.categories.some((c) => c.startsWith("category-ads"));
const isPicked = (it) => picked[it.kind].has(it.key);
const via = (it) => (it.kind === "services" ? [...picked.services].find((p) => p !== it.key && it.parents?.includes(p)) : null);
const opensNow = (it) => !!(it.allowed || it.allowedVia); // on the router
const opensAfter = (it) => isPicked(it) || !!via(it);       // after Save
const blockedNow = (it) => !!it.seen?.blocked && !opensNow(it);

function matches(it) {
  if (filter.ads ? !isAds(it) : isAds(it) && !isPicked(it)) return false; // ads stay out unless asked for (or switched on)
  if (filter.blocked && !blockedNow(it)) return false;
  if (filter.categories.size && !it.categories.some((c) => useful(c) && filter.categories.has(prettyCategory(c)))) return false;
  const q = filter.q;
  return !q || it.title.toLowerCase().includes(q) || it.key.includes(q) || (it.names ?? []).some((n) => n.includes(q));
}

function toggle(it) {
  isPicked(it) ? picked[it.kind].delete(it.key) : picked[it.kind].add(it.key);
  render();
}

/** One bar for the period's data, a segment per service, largest first. */
function renderShare(all) {
  const used = all.filter((it) => total(it) > 0).sort((a, b) => total(b) - total(a));
  const sum = used.reduce((a, it) => a + total(it), 0);
  $("sharetitle").replaceChildren(`Data ${periodText()}`, el("span", { textContent: view.flows ? ` · ${bytes(sum)}` : "" }));
  $("period").hidden = !view.reset.at;
  if (view.reset.at) {
    $("period").replaceChildren(...[["days", `${view.keepDays} days`], ["since", `Since ${at(view.reset.at)}`]].map(([v, label]) =>
      Object.assign(el("button", { id: `period:${v}`, ariaPressed: filter.period === v, textContent: label }), { onclick: () => { filter.period = v; render(); } })));
  }
  if (!view.flows || !sum) {
    $("sharebar").hidden = $("keys").hidden = true;
    $("sharenote").hidden = false;
    $("sharenote").textContent = view.flows
      ? `No data counted ${periodText()} yet.`
      : "Data per service needs the router's Traffic Flow export. The Data usage page says how to set it up.";
    return;
  }
  $("sharebar").hidden = $("keys").hidden = false;
  // What gets through always shows, however small: that is the part of the bar the crew controls while metered.
  const through = used.filter(opensAfter);
  const blockedBig = used.filter((it) => !opensAfter(it) && total(it) / sum >= SHARE_MIN).slice(0, 8);
  const big = [...through, ...blockedBig].sort((a, b) => total(b) - total(a));
  const rest = sum - big.reduce((a, it) => a + total(it), 0); // only small blocked services are left over
  const state = (it) => (opensAfter(it) ? "gets through while metered" : "blocked while metered");
  const pct = (n) => `${Math.max(1, Math.round((n / sum) * 100))}%`;
  $("sharebar").replaceChildren(...big.map((it) => {
    const seg = el("button", {
      className: opensAfter(it) ? "seg-share" : "seg-share blocked",
      style: `flex: ${total(it)} 1 0`,
      ariaLabel: `${it.title}: ${bytes(total(it))}, ${pct(total(it))}, ${state(it)}. Show in the list.`,
    });
    seg.onclick = () => showRow(it);
    seg.tabIndex = -1;
    label(seg, it.title, `${bytes(total(it))} · ${pct(total(it))} · ${state(it)}`);
    return seg;
  }), ...(rest > 0 ? [label(el("span", { className: "seg-share blocked", style: `flex: ${rest} 1 0` }), "Other blocked services", `${bytes(rest)} · ${pct(rest)}`)] : []));
  // One tab stop for the whole bar; arrow keys move between segments.
  const segs = [...$("sharebar").querySelectorAll("button")];
  if (segs.length) segs[0].tabIndex = 0;
  $("sharebar").onkeydown = (e) => {
    const step = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[e.key];
    const i = segs.indexOf(document.activeElement);
    if (i < 0 || (!step && e.key !== "Home" && e.key !== "End")) return;
    e.preventDefault();
    const next = segs[e.key === "Home" ? 0 : e.key === "End" ? segs.length - 1 : Math.max(0, Math.min(segs.length - 1, i + step))];
    segs.forEach((s) => (s.tabIndex = s === next ? 0 : -1));
    next.focus();
  };
  // The keys say what the two fills mean, and always name what gets through.
  const of = (arr) => arr.reduce((a, it) => a + total(it), 0);
  const blockedAll = used.filter((it) => !opensAfter(it));
  const named = (arr, n) => arr.slice(0, n).map((it) => `${it.title} ${bytes(total(it))}`).join(", ") + (arr.length > n ? `, ${arr.length - n} more` : "");
  $("keys").replaceChildren(
    el("span", { className: "key" }, el("b", { textContent: `Gets through while metered · ${bytes(of(through))}` }), through.length ? `: ${named(through, 3)}` : ": nothing that used data"),
    el("span", { className: "key blocked" }, el("b", { textContent: `Blocked while metered · ${bytes(of(blockedAll))}` }), blockedAll.length ? `: ${named(blockedAll, 3)}` : ""));
  $("sharenote").hidden = true;
}

/** Name the segment under the pointer (or keyboard focus) in a label just above the bar. */
function label(seg, name, facts) {
  const show = () => {
    const tip = $("sharetip");
    $("sharebar").querySelector(".on")?.classList.remove("on");
    seg.classList.add("on");
    tip.replaceChildren(el("b", { textContent: name }), ` · ${facts}`);
    tip.hidden = false;
    const bar = $("sharebar").getBoundingClientRect(), box = seg.getBoundingClientRect();
    const centre = box.left - bar.left + box.width / 2;
    tip.style.left = `${Math.max(0, Math.min(centre - tip.offsetWidth / 2, bar.width - tip.offsetWidth))}px`;
    tip.style.top = `${-tip.offsetHeight - 8}px`;
  };
  const hide = () => { seg.classList.remove("on"); $("sharetip").hidden = true; };
  seg.onpointerenter = (e) => { if (e.pointerType === "mouse") show(); };
  seg.onpointerleave = hide;
  seg.onfocus = show;
  seg.onblur = hide;
  return seg;
}

/** Bring a service's row into view, open, and briefly marked. */
function showRow(it) {
  const id = `${it.kind}:${it.key}`;
  filter.q = ""; $("search").value = ""; filter.categories.clear(); filter.blocked = false;
  if (isAds(it)) filter.ads = true;
  open.add(id);
  flashed = new Set([id]);
  render();
  document.getElementById(`row:${id}`)?.scrollIntoView({ block: "center" }); // instant: a smooth scroll can be cut short and leave the row under the save bar
  document.getElementById(`name:${id}`)?.focus({ preventScroll: true });
  setTimeout(() => { flashed = new Set(); render(); }, 1800);
}

function row(it, sum) {
  const id = `${it.kind}:${it.key}`;
  const parent = via(it);
  const change = opensAfter(it) !== opensNow(it) && el("span", { className: opensAfter(it) ? "tag" : "tag closing", textContent: opensAfter(it) ? "will be allowed" : "will be blocked" });
  const cats = it.categories.filter(useful).slice(0, 2).map(prettyCategory);
  const sub = [
    blockedNow(it) ? el("span", { className: "blocked", textContent: `stopped ${ago(it.seen.blocked)}` }) : null,
    parent ? `via ${prettyId(parent)}` : null,
    isAds(it) ? "Ads / tracking" : cats.join(", ") || (it.kind === "domains" ? "domain" : null),
    !blockedNow(it) ? (it.seen ? `seen ${ago(it.seen.last)}` : "not seen yet") : null,
  ].filter(Boolean).flatMap((part, i) => (i ? [" · ", part] : [part]));
  const name = el("button", { className: "name", id: `name:${id}`, ariaExpanded: open.has(id) },
    el("span", { className: "title", textContent: it.title }), change, el("small", {}, ...sub));
  name.onclick = () => { open.has(id) ? open.delete(id) : open.add(id); render(); };
  const gb = view.flows && el("span", { className: "gb" }, total(it) ? bytes(total(it)) : "–", el("small", { textContent: total(it) && sum ? `${Math.max(1, Math.round((total(it) / sum) * 100))}%` : "" }));
  const sw = el("button", { className: "switch", id, role: "switch", ariaChecked: opensAfter(it), disabled: !!parent && !isPicked(it), ariaLabel: `Allow ${it.title} while metered` });
  sw.onclick = () => toggle(it);
  if (open.has(id)) name.setAttribute("aria-controls", `more:${id}`);
  const details = open.has(id) && el("div", { className: "details", id: `more:${id}` },
    it.names?.length && el("div", { textContent: `Looked up: ${it.names.join(", ")}` }),
    total(it) > 0 && el("div", { textContent: `Data ${periodText()}: ${bytes(total(it))}, of which ${bytes(vols(it)[1])} while metered.` }),
    it.kind === "services" && el("div", { textContent: `Allowing it opens ${plural(it.size, "v2fly domain")} and their subdomains.` }),
    it.includes?.length && el("div", { textContent: `Includes: ${it.includes.map(prettyId).join(", ")}` }),
    it.parents?.length && el("div", { textContent: `Part of: ${it.parents.map(prettyId).join(", ")}` }),
    it.kind === "domains" && el("div", { textContent: "Not in v2fly. Allowing it opens this domain and its subdomains." }));
  return el("div", { className: flashed.has(id) ? "item flash" : "item", id: `row:${id}` }, el("div", { className: "line" }, name, gb, sw), details);
}

/** The filter and sort column: sort as radios, filters as checkboxes with counts. */
function renderSide(all) {
  $("sort").replaceChildren(...SORTS.map(([v, label]) => {
    const input = el("input", { type: "radio", name: "sort", id: `sort:${v}`, checked: filter.sort === v });
    input.onchange = () => { filter.sort = v; render(); };
    return el("label", { className: "opt" }, input, label);
  }));
  const option = (id, label, n, checked, onchange) => {
    const input = el("input", { type: "checkbox", id: `filter:${id}`, checked });
    input.onchange = onchange;
    return el("label", { className: "opt" }, input, label, el("span", { className: "n", textContent: n }));
  };
  // Categories merge by their readable name: v2fly's "games" and "games-!cn" are one choice here.
  const counts = new Map();
  for (const it of all) {
    for (const label of new Set(it.categories.filter((c) => useful(c) && !c.startsWith("category-ads")).map(prettyCategory))) {
      counts.set(label, (counts.get(label) ?? 0) + 1);
    }
  }
  const ranked = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const shown = allCategories ? ranked : ranked.filter(([label], i) => i < CATEGORIES_SHOWN || filter.categories.has(label));
  const blocked = all.filter(blockedNow).length;
  const ads = all.filter(isAds).length;
  const more = ranked.length > shown.length || allCategories && ranked.length > CATEGORIES_SHOWN;
  const toggle = more && el("button", { className: "linkbtn", id: "morecats", textContent: allCategories ? "Show fewer" : `Show all ${ranked.length}` });
  if (toggle) toggle.onclick = () => { allCategories = !allCategories; render(); };
  $("filters").replaceChildren(...[
    // The watch job first: what tried to get out while metered and was stopped.
    blocked && option("blocked", "Stopped lately", blocked, filter.blocked, () => { filter.blocked = !filter.blocked; render(); }),
    ads && option("ads", "Ads / tracking", ads, filter.ads, () => { filter.ads = !filter.ads; render(); }),
    shown.map(([label, n]) => option(`cat:${label}`, label, n, filter.categories.has(label), () => {
      filter.categories.has(label) ? filter.categories.delete(label) : filter.categories.add(label);
      render();
    })),
    toggle].flat().filter((c) => c instanceof Node));
  const active = filter.categories.size + (filter.blocked ? 1 : 0) + (filter.ads ? 1 : 0);
  $("clearfilters").hidden = !active;
  $("sidesum").textContent = `Filter & sort · ${SORTS.find(([v]) => v === filter.sort)[1]}${active ? ` · ${plural(active, "filter")}` : ""}`;
}

function render() {
  // Everything below is rebuilt: remember what had focus, so keyboard and screen-reader users keep their place.
  const focused = document.activeElement?.id;
  draw();
  placeSide(); // also after every redraw: a resize observer may not fire while the tab is in the background
  if (focused && document.activeElement === document.body) document.getElementById(focused)?.focus({ preventScroll: true });
}

function draw() {
  const all = items();
  renderSide(all);
  renderShare(all);
  const sum = all.reduce((a, it) => a + total(it), 0);
  const by = {
    data: (a, b) => total(b) - total(a),
    name: (a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: "base" }),
    recent: (a, b) => (b.seen?.last ?? 0) - (a.seen?.last ?? 0),
    days: (a, b) => (b.seen?.days ?? 0) - (a.seen?.days ?? 0),
  };
  const order = (a, b) => by[filter.sort](a, b) || by.data(a, b) || by.name(a, b);
  const shown = all.filter(matches).sort(order);
  const known = new Set(all.filter((it) => it.kind === "services").map((it) => it.key));
  const fromCatalog = catalogHits.filter((s) => !known.has(s.id)).map((s) => ({ kind: "services", key: s.id, title: prettyId(s.id), ...s }));

  const parts = shown.map((it) => row(it, sum));
  if (fromCatalog.length) parts.push(el("h2", { textContent: "From the v2fly catalog", style: "margin-top: 20px" }), el("p", { className: "muted listnote", textContent: "Not seen on board yet." }), ...fromCatalog.map((it) => row(it, sum)));
  if (!parts.length) {
    parts.push(el("p", { className: "muted empty", textContent: searching
      ? `Nothing on board matches “${filter.q}”. Searching the v2fly catalog…`
      : catalogFailed
      ? `Nothing on board matches “${filter.q}”, and the v2fly catalog couldn't be searched. Try again.`
      : filter.q
      ? `Nothing matches “${filter.q}” on board${filter.q.length >= 2 ? " or in the v2fly catalog" : ""}.`
      : filter.blocked || filter.categories.size
      ? "Nothing in this filter."
      : "Nothing seen yet. Devices show up here once they look names up through the router." }));
  }
  // A domain nobody has looked up yet, e.g. a GRIB server before leaving port: allow it by typing it.
  if (FQDN.test(filter.q) && !all.some((it) => it.kind === "domains" && it.key === filter.q)) {
    const add = el("button", { className: "linkbtn", id: "adddomain", textContent: `Allow ${filter.q} while metered` });
    add.onclick = () => { picked.domains.add(filter.q); render(); };
    parts.unshift(el("p", { className: "add" }, add, el("span", { className: "muted", textContent: " Not seen on board yet. Opens this domain and its subdomains." })));
  }
  const unmatched = total({ seen: { bytes: view.unmatched, since: view.reset.unmatched } });
  if (view.flows && unmatched > 0 && !filter.q) parts.push(el("p", { className: "muted listnote", textContent: `Plus ${bytes(unmatched)} ${periodText()} to addresses no DNS lookup explains (hard-coded IPs, DNS over HTTPS).` }));
  $("lists").replaceChildren(...parts);
  renderSummary(all);
}

/** The router's profile in the header, when it was last saved, and what Save would change. */
function renderSummary(all) {
  setRouterProfile(view.profile);
  $("savedat").textContent = view.savedAt ? `Router updated ${dated(view.savedAt)}` : "";
  renderPending(all);
}

function renderPending(all) {
  const opening = all.filter((it) => opensAfter(it) && !opensNow(it));
  const closing = all.filter((it) => !opensAfter(it) && opensNow(it));
  const n = opening.length + closing.length;
  const busy = !!$("save").dataset.busy;
  $("save").disabled = n === 0 || busy;
  $("discard").hidden = n === 0 || busy;
  $("pending").hidden = n === 0;
  if (!n) return;
  const parts = [];
  if (opening.length) parts.push(`allow ${list(opening.map((it) => it.title))}`);
  if (closing.length) parts.push(`block ${list(closing.map((it) => it.title))}`);
  let text = parts.join(", ");
  text = `${text[0].toUpperCase()}${text.slice(1)}.`;
  // A forecast on the 14 days, whatever period is shown: a blocked service has used next to nothing while
  // metered, precisely because it was blocked, so only its whole recent use says what allowing it may cost.
  const recent = opening.reduce((a, it) => a + (it.seen?.bytes?.[0] ?? 0) + (it.seen?.bytes?.[1] ?? 0), 0);
  if (view.flows && recent > 0) {
    text += ` ${opening.length === 1 ? "It" : "They"} used ${bytes(recent)} in the last ${view.keepDays} days`;
    text += view.pricePerGb > 0 ? `, about ${((recent / 1e9) * view.pricePerGb).toFixed(2)} ${view.currency} if metered.` : ".";
  }
  const secs = saveSeconds(all);
  if (secs >= 5) text += ` Saving takes about ${secs}\u00a0s.`;
  $("pending").textContent = text;
  if (!busy && $("status").textContent.startsWith("Saved")) { $("status").textContent = ""; $("status").className = "muted"; } // a new edit makes the last result stale
}

const unsaved = () => !$("pending").hidden;
const saveSeconds = (all) => Math.round(all.filter((it) => isPicked(it) !== !!it.allowed).reduce((a, it) => a + (it.kind === "services" ? it.size : 1), 0) * SECONDS_PER_ENTRY);

function show(v) {
  view = v;
  picked = {
    services: new Set(v.services.filter((s) => s.allowed).map((s) => s.id)),
    domains: new Set(v.domains.filter((d) => d.allowed).map((d) => d.domain)),
  };
  filter.period = view.reset.at ? filter.period ?? "since" : "days"; // since the reset once there is one: it's what a reset is for
  $("reset").hidden = !v.flows;
  $("fixed").replaceChildren(...v.fixed.map((f) => el("div", { className: "item" }, el("div", { className: "title", textContent: f.name }), el("div", { className: "details", textContent: f.hosts.join(", ") }))));
  $("credit").textContent = `Services and categories: v2fly/domain-list-community (${(v.v2fly ?? "").slice(0, 7)}), MIT licence.`;
  render();
}

$("reset").onclick = async () => {
  try {
    view = await api("/reset", { method: "POST" }); // keeps unsaved switches: `picked` is left alone
    filter.period = "since";
    render();
    $("resetnote").textContent = `Counting from ${dated(view.reset.at)}. The ${view.keepDays}-day history stays.`;
    setTimeout(() => ($("resetnote").textContent = ""), 8000);
  } catch (err) {
    $("resetnote").textContent = `Couldn't reset: ${err.message}`;
  }
};

let searchTimer;
$("search").oninput = () => {
  filter.q = $("search").value.trim().toLowerCase();
  searching = filter.q.length >= 2;
  render();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    catalogFailed = false;
    catalogHits = filter.q.length >= 2 ? (await api(`/catalog?q=${encodeURIComponent(filter.q)}`).catch(() => ((catalogFailed = true), { services: [] }))).services : [];
    searching = false;
    render();
  }, 250);
};

$("discard").onclick = () => show(view);
// Where the filter column sticks: at the top when it fits above the save bar, else as far up as keeps its end
// visible above the save bar (whose height changes with its preview text).
function placeSide() {
  const room = innerHeight - document.querySelector(".savebar").offsetHeight;
  document.documentElement.style.setProperty("--side-top", `${Math.min(0, room - document.querySelector(".side").offsetHeight)}px`);
}
const sizes = new ResizeObserver(placeSide);
sizes.observe(document.querySelector(".savebar"));
sizes.observe(document.querySelector(".side"));
addEventListener("resize", placeSide);
$("clearfilters").onclick = () => { filter.categories.clear(); filter.blocked = filter.ads = false; render(); };
// The column is always open beside the list; on a phone it folds into one line above it.
const wide = matchMedia("(min-width: 761px)");
const syncSide = () => { if (wide.matches) $("sidebox").open = true; };
wide.addEventListener("change", syncSide);
syncSide();

$("save").onclick = async () => {
  const body = { services: [...picked.services], domains: [...picked.domains] };
  const all = items();
  const opening = all.filter((it) => opensAfter(it) && !opensNow(it)).map((it) => it.title);
  const closing = all.filter((it) => !opensAfter(it) && opensNow(it)).map((it) => it.title);
  const changed = all.filter((it) => opensAfter(it) !== opensNow(it)).map((it) => `${it.kind}:${it.key}`);
  const secs = saveSeconds(all);
  $("save").dataset.busy = "1";
  $("status").className = "muted";
  $("status").textContent = `Saving to the router…${secs >= 5 ? ` about ${secs}\u00a0s` : ""}`;
  // Switches flipped now would be overwritten by the saved state: hold the page still until the router answers.
  for (const id of ["lists", "share"]) { $(id).inert = true; $(id).setAttribute("aria-busy", "true"); }
  $("reset").disabled = true;
  render();
  const done = () => {
    delete $("save").dataset.busy;
    for (const id of ["lists", "share"]) { $(id).inert = false; $(id).removeAttribute("aria-busy"); }
    $("reset").disabled = false;
  };
  try {
    const result = await api("/allowlist", { method: "POST", body: JSON.stringify(body) });
    done();
    flashed = new Set(changed);
    show(result);
    setTimeout(() => { flashed = new Set(); render(); }, 2500);
    const outcome = [
      opening.length && `${list(opening)} ${opening.length === 1 ? "now gets" : "now get"} through while metered`,
      closing.length && `${list(closing)} ${closing.length === 1 ? "is" : "are"} blocked while metered`,
    ].filter(Boolean).join("; ");
    const { added, removed, ms } = result.sync ?? {};
    $("status").className = "confirm";
    $("status").textContent = `Saved. ${outcome || "The router is updated"}.` + (result.sync ? ` (${plural(added + removed, "router entry", "router entries")} updated in ${(ms / 1000).toFixed(1)} s)` : "");
  } catch (err) {
    done();
    $("status").className = "error";
    $("status").textContent = `Couldn't save: ${err.message}. Your switches are kept, try Save again.`;
    render();
  }
};

addEventListener("beforeunload", (e) => { if (view && unsaved()) e.preventDefault(); });

api("/allowlist").then(show).catch((err) => {
  if (/plugin not running/.test(err.message)) showNotReady(); // installed but not set up, or the router is unreachable
  else $("message").textContent = err.message;
});
</script>
</body>
</html>
